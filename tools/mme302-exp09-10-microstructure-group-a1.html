<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MME 302 · EXP 9–10 · Microstructure · Group A1</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#18191d;--muted:#777b84;--line:#e1e3e7;--accent:#5f57e8;--paper:#fff;--serif:"Times New Roman",Times,serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1450px;margin:auto;padding:18px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.brand{flex:1}.kicker{font-size:9px;letter-spacing:.14em;color:var(--accent);font-weight:800;text-transform:uppercase}
h1{font-size:22px;margin:3px 0;letter-spacing:-.035em}.sub{font-size:10px;color:var(--muted)}
.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:10px;font-weight:700}.btn.primary{background:#18191d;color:#fff;border-color:#18191d}
.layout{display:grid;grid-template-columns:310px 1fr;gap:14px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 30px #0000000d}
.controls{padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.section{padding:11px 0;border-bottom:1px solid var(--line)}.section:first-child{padding-top:0}.section:last-child{border:0}
.section h3{font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 9px}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}
.input,.select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:10px;background:#fff;outline:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}
.range{width:100%;accent-color:var(--accent)}.range-row{display:grid;grid-template-columns:1fr 45px;gap:7px;align-items:center;margin:7px 0}.value{text-align:right;font-size:9px;color:var(--muted)}
.items{display:grid;gap:5px;margin-top:8px}.item{display:grid;grid-template-columns:38px 1fr;gap:7px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px}
.thumb{width:38px;height:29px;object-fit:cover;border-radius:4px}.item b{display:block;font-size:9px}.item small{font-size:8px;color:var(--muted)}
.preview{padding:17px;min-height:calc(100vh - 80px);display:flex;justify-content:center}.pages{display:flex;flex-direction:column;gap:18px;align-items:center}
.page{width:210mm;height:297mm;background:#fff;position:relative;box-shadow:0 7px 32px #0002;overflow:hidden;font-family:var(--serif)}
.inner{position:absolute;inset:var(--mt) var(--mr) var(--mb) var(--ml);display:flex;flex-direction:column}
.title{text-align:center;font-size:17px;font-weight:700;margin-bottom:3mm}.meta{text-align:center;font-size:10px;margin-bottom:5mm}
.grid{display:grid;align-content:start}.cell{text-align:center;min-width:0}.pic{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fafafa;border:1px solid #d7d7d7;display:block;transform:scale(var(--scale));transform-origin:center}.cap{font-size:11px;font-weight:700;margin-top:2mm}
.cap span{font-weight:400}.page-no{position:absolute;bottom:4mm;left:0;right:0;text-align:center;font-size:9px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.controls{position:static;max-height:none}.page{transform:scale(.7);transform-origin:top center;margin-bottom:-85mm}}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.top,.controls{display:none!important}.app{padding:0}.layout{display:block}.preview{padding:0}.pages{gap:0}.page{box-shadow:none;page-break-after:always}.page:last-child{page-break-after:auto}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <div class="kicker">Report Lagbe · MME 302</div>
    <h1>EXP 9–10 · Microstructure · Group A1</h1>
    <div class="sub">A4 compilation · local images · print to PDF</div>
  </div>
  <div class="actions">
    <button class="btn" onclick="location.href='../index.html'">⌂ Home</button>
    <button class="btn" onclick="location.reload()">Reset</button>
    <button class="btn primary" onclick="print()">Print / PDF</button>
  </div>
</header>

<div class="layout">
<aside class="panel controls">
  <div class="section">
    <h3>Compilation</h3>
    <div class="field"><label>Title</label><input class="input" id="title" value="MME 302 · EXP 9–10 · Microstructure"></div>
    <div class="row">
      <div class="field"><label>Student ID</label><input class="input" id="sid" placeholder="2205xxx"></div>
      <div class="field"><label>Columns</label><select class="select" id="cols"><option>1</option><option selected>2</option><option>3</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Font</label><select class="select" id="font">
        <option value='"Times New Roman",Times,serif'>Times New Roman</option>
        <option value='Georgia,serif'>Georgia</option>
        <option value='Cambria,serif'>Cambria</option>
        <option value='Garamond,serif'>Garamond</option>
      </select></div>
      <div class="field"><label>Page start</label><input class="input" id="pstart" type="number" value="1" min="1"></div>
    </div>
  </div>

  <div class="section">
    <h3>Layout</h3>
    <div class="range-row"><input class="range" id="gap" type="range" min="2" max="16" value="7"><span class="value" id="gapv">7 mm</span></div>
    <div class="range-row"><input class="range" id="scale" type="range" min="75" max="115" value="100"><span class="value" id="scalev">100%</span></div>
    <div class="range-row"><input class="range" id="radius" type="range" min="0" max="18" value="2"><span class="value" id="radiusv">2 mm</span></div>
    <div class="range-row"><input class="range" id="mt" type="range" min="8" max="25" value="14"><span class="value" id="mtv">14 mm</span></div>
    <div class="range-row"><input class="range" id="mb" type="range" min="8" max="25" value="14"><span class="value" id="mbv">14 mm</span></div>
    <div class="range-row"><input class="range" id="ml" type="range" min="8" max="22" value="14"><span class="value" id="mlv">14 mm</span></div>
    <div class="range-row"><input class="range" id="mr" type="range" min="8" max="22" value="14"><span class="value" id="mrv">14 mm</span></div>
  </div>

  <div class="section">
    <h3>Show</h3>
    <label class="field"><input id="st" type="checkbox" checked> Title</label>
    <label class="field"><input id="si" type="checkbox" checked> Student ID</label>
    <label class="field"><input id="sm" type="checkbox" checked> Magnification</label>
    <label class="field"><input id="sp" type="checkbox" checked> Page number</label>
  </div>

  <div class="section">
    <h3>Images · 10</h3>
    <div class="sub">Preset from Group A1. You can replace/add images locally with the picker if needed.</div>
    <div class="items" id="items"></div>
  </div>
</aside>

<main class="panel preview"><div class="pages" id="pages"></div></main>
</div>
</div>

<script>
const A='../assets/microstructures/MME302/Exp09-10/Group-A1/';
const names=[
["A1 500-01.jpg","A1","500"],["A1 500-02.jpg","A1","500"],
["A1 200-01.jpg","A1","200"],["A1 100-01.jpg","A1","100"],
["A1 200-02.jpg","A1","200"],["A1 500-03.jpg","A1","500"],
["A1 200-03.jpg","A1","200"],["A1 500-04.jpg","A1","500"],
["A1 200-04.jpg","A1","200"],["A1 500-05.jpg","A1","500"]
];
let S={title:"MME 302 · EXP 9–10 · Microstructure",sid:"",cols:2,font:'"Times New Roman",Times,serif',
gap:7,scale:100,radius:2,mt:14,mb:14,ml:14,mr:14,pstart:1,st:true,si:true,sm:true,sp:true};

function $(id){return document.getElementById(id)}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderList(){$("items").innerHTML=names.map(x=>`<div class="item"><img class="thumb" src="${A+encodeURIComponent(x[0])}"><div><b>${x[1]}</b><small>${x[2]}× · ${x[0]}</small></div></div>`).join("")}
function render(){
 document.documentElement.style.setProperty("--serif",S.font);
 const per=S.cols*5, pc=Math.max(1,Math.ceil(names.length/per));
 $("pages").innerHTML=Array.from({length:pc},(_,p)=>{
  const chunk=names.slice(p*per,(p+1)*per);
  return `<section class="page" style="--mt:${S.mt}mm;--mr:${S.mr}mm;--mb:${S.mb}mm;--ml:${S.ml}mm">
   <div class="inner">
    ${S.st?`<div class="title">${esc(S.title)}</div>`:""}
    ${S.si&&S.sid?`<div class="meta">Student ID: ${esc(S.sid)}</div>`:""}
    <div class="grid" style="grid-template-columns:repeat(${S.cols},1fr);gap:${S.gap}mm">
     ${chunk.map(x=>`<div class="cell"><img class="pic" style="border-radius:${S.radius}mm;--scale:${S.scale/100}" src="${A+encodeURIComponent(x[0])}"><div class="cap">${x[1]} ${S.sm?`<span>(${x[2]}×)</span>`:""}</div></div>`).join("")}
    </div>
   </div>
   ${S.sp?`<div class="page-no">${S.pstart+p}</div>`:""}
  </section>`
 }).join("");
}
function bind(id,key,suffix=""){const e=$(id),v=$(id+"v");e.oninput=()=>{S[key]=Number(e.value);v.textContent=e.value+suffix;render()};v.textContent=e.value+suffix}
$("title").oninput=e=>{S.title=e.target.value;render()};$("sid").oninput=e=>{S.sid=e.target.value;render()};
$("cols").onchange=e=>{S.cols=Number(e.target.value);render()};$("font").onchange=e=>{S.font=e.target.value;render()};
$("pstart").oninput=e=>{S.pstart=Number(e.target.value)||1;render()};
["st","si","sm","sp"].forEach(k=>$(k).onchange=e=>{S[k]=e.target.checked;render()});
bind("gap","gap"," mm");bind("scale","scale","%");bind("radius","radius"," mm");bind("mt","mt"," mm");bind("mb","mb"," mm");bind("ml","ml"," mm");bind("mr","mr"," mm");
renderList();render();
</script>
</body>
</html>
