<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report Lagbe • Lab Report Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--paper:#fff;--ink:#17191d;--muted:#737984;--line:#e3e6eb;
  --accent:#6d5dfc;--accent2:#00a99d;--soft:#f0efff;--shadow:0 14px 45px rgba(20,25,35,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif}
button,input,select{font:inherit}
button,a{cursor:pointer}
.app{max-width:1420px;margin:auto;padding:28px}
.top{display:flex;align-items:center;gap:22px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:14px;flex:1}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;box-shadow:0 10px 25px rgba(109,93,252,.22)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
h1{font-size:34px;line-height:1;margin:5px 0 7px;letter-spacing:-.04em}
.subtitle{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;text-decoration:none;box-shadow:0 5px 18px rgba(20,25,35,.04)}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:25px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-100px;top:-150px;background:linear-gradient(135deg,rgba(109,93,252,.16),rgba(0,169,157,.08));pointer-events:none}
.hero h2{font-size:22px;margin:0 0 8px;letter-spacing:-.03em}
.hero p{max-width:780px;color:var(--muted);font-size:13px;line-height:1.65;margin:0}
.controls{display:grid;grid-template-columns:minmax(240px,1fr) 180px 180px auto;gap:10px;margin:14px 0}
.input,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;outline:none;font-size:12px}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:11px;color:var(--muted)}
.stat strong{color:var(--ink);font-size:13px;margin-right:5px}
.section-head{display:flex;align-items:end;gap:10px;margin:18px 2px 10px}
.section-head h3{margin:0;font-size:18px;letter-spacing:-.02em}
.section-head span{margin-left:auto;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 28px rgba(20,25,35,.05);transition:.18s;display:flex;flex-direction:column;min-height:185px}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(20,25,35,.10);border-color:#d8d3ff}
.icon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:20px;margin-bottom:13px}
.badge{display:inline-flex;width:max-content;background:#f2f3f5;color:#656b75;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.card h4{font-size:14px;margin:10px 0 7px;line-height:1.35}
.card p{font-size:10px;color:var(--muted);margin:0 0 10px}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.open{flex:1;text-align:center;background:var(--ink);color:#fff;text-decoration:none;border-radius:10px;padding:10px;font-size:11px;font-weight:800}
.open:hover{background:var(--accent)}
.fav{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff}
.fav.active{background:#fff3cf;border-color:#f1d27c}
.empty{padding:45px;text-align:center;background:#fff;border:1px dashed #ccd0d7;border-radius:18px;color:var(--muted);font-size:12px;grid-column:1/-1}
.footer{padding:18px 2px 8px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#17191d;color:#fff;padding:10px 14px;border-radius:10px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
@media(max-width:620px){.app{padding:15px}.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <div class="logo">R</div>
    <div>
      <div class="kicker">Lab Report Toolkit</div>
      <h1>Report Lagbe.</h1>
      <div class="subtitle">Graphs · Figures · Microstructures · PDFs</div>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="refreshBtn">↻ Refresh tools</button>
    <button class="btn" id="themeBtn">◐ Theme</button>
  </div>
</header>

<section class="hero">
  <h2>Lab report tools, in one place.</h2>
  <p>Add a tool to <b>tools/</b>. Push. It appears here automatically.</p>
  <div class="stats">
    <div class="stat"><strong id="toolCount">—</strong> tools</div>
    <div class="stat"><strong id="categoryCount">—</strong> categories</div>
    <div class="stat"><strong id="lastSync">—</strong> synced</div>
  </div>
</section>

<div class="controls">
  <input class="input" id="search" placeholder="⌕ Search experiments, graphs, microscopy, PDF...">
  <select class="select" id="category"><option value="all">All categories</option></select>
  <select class="select" id="sort"><option value="new">Newest first</option><option value="name">Name A–Z</option><option value="category">Category</option><option value="fav">Favorites first</option></select>
  <button class="btn primary" id="clearBtn">Clear</button>
</div>

<div class="section-head"><h3>Tools</h3><span id="resultInfo">Loading…</span></div>
<main class="grid" id="grid"><div class="empty">Loading Report Lagbe tools…</div></main>

<footer class="footer">
  <span>Report Lagbe</span>
  <span id="repoStatus">Manifest</span>
</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* Only change these 3 values when moving this home page to another repository. */
const CONFIG={
  owner:"sifatuul",
  repo:"ASTM-615",
  branch:"main",
  toolsDir:"tools",
  homeFile:"index.html"
};

const $=id=>document.getElementById(id);
const iconFor = s => /graph/i.test(s)?"📊":/micro|metallograph/i.test(s)?"🔬":/pdf|report/i.test(s)?"📄":/image|collage|figure/i.test(s)?"🖼️":/calc/i.test(s)?"🧮":/data|table/i.test(s)?"📋":"🧰";

function slugToTitle(path){
  const name=path.split("/").pop().replace(/\.html$/i,"");
  return name.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}
function categoryFor(path,title){
  const s=(path+" "+title).toLowerCase();
  if(/micro|metallo/.test(s)) return "Microscopy";
  if(/graph|plot|chart/.test(s)) return "Graphs";
  if(/pdf|report|compile/.test(s)) return "PDF & Report";
  if(/image|collage|figure/.test(s)) return "Images & Figures";
  if(/data|table|calc/.test(s)) return "Data & Calculators";
  return "Other";
}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function favorites(){try{return JSON.parse(localStorage.getItem("reportLagbeFavorites")||"[]")}catch{return[]}}
function saveFavorites(v){localStorage.setItem("reportLagbeFavorites",JSON.stringify(v))}

async function loadManifest(){
  $("resultInfo").textContent="Loading tools…";
  const fallback=[{
    path:"tools/mme302-exp08-09-graph-maker.html",
    title:"MME 302 Experiment 08–09 Graph Maker",
    category:"Graphs",
    icon:"📊",
    date:"2026-09-23"
  }];
  try{
    const localOrPages="tools.json";
    const r=await fetch(localOrPages,{cache:"no-store"});
    if(!r.ok) throw new Error("manifest unavailable");
    const data=await r.json();
    return Array.isArray(data)?data:fallback;
  }catch{
    /* file:// testing and first-run fallback */
    return fallback;
  }
}
async function discover(){
  $("resultInfo").textContent="Loading tools…";
  const tools=await loadManifest();
  const fav=favorites();
  window.TOOLS=tools.map(x=>({...x,
    url:x.url||x.path,
    fav:fav.includes(x.path)
  }));
  const cats=[...new Set(window.TOOLS.map(x=>x.category))].sort();
  $("category").innerHTML='<option value="all">All categories</option>'+cats.map(c=>`<option>${c}</option>`).join("");
  $("toolCount").textContent=window.TOOLS.length;
  $("categoryCount").textContent=cats.length;
  $("lastSync").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  $("repoStatus").textContent="Manifest loaded";
  render();
}
function render(){
  let a=[...(window.TOOLS||[])];
  const q=$("search").value.trim().toLowerCase(), cat=$("category").value, sort=$("sort").value;
  if(q)a=a.filter(x=>(x.title+" "+x.path+" "+x.category).toLowerCase().includes(q));
  if(cat!=="all")a=a.filter(x=>x.category===cat);
  if(sort==="new")a.sort((x,y)=>new Date(y.date)-new Date(x.date));
  if(sort==="name")a.sort((x,y)=>x.title.localeCompare(y.title));
  if(sort==="category")a.sort((x,y)=>(x.category+x.title).localeCompare(y.category+y.title));
  if(sort==="fav")a.sort((x,y)=>Number(y.fav)-Number(x.fav));
  $("resultInfo").textContent=`${a.length} result${a.length===1?"":"s"}`;
  $("grid").innerHTML=a.length?a.map(x=>`
    <article class="card">
      <div class="icon">${x.icon}</div>
      <span class="badge">${x.category}</span>
      <h4>${x.title}</h4>
      <p>${new Date(x.date).toLocaleDateString()}</p>
      <div class="card-foot">
        <a class="open" href="${x.url}">Open →</a>
        <button class="fav ${x.fav?"active":""}" title="Favorite" data-path="${x.path}">${x.fav?"★":"☆"}</button>
      </div>
    </article>`).join(""):'<div class="empty">No matching tools.</div>';
  document.querySelectorAll(".fav").forEach(b=>b.onclick=()=>{
    const f=favorites(),p=b.dataset.path,i=f.indexOf(p);
    i>=0?f.splice(i,1):f.push(p);saveFavorites(f);
    const t=window.TOOLS.find(x=>x.path===p);if(t)t.fav=i<0;render();
  });
}
document.addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){e.preventDefault();$("search").focus()}
  if(e.key.toLowerCase()==="r" && (e.ctrlKey||e.metaKey)){e.preventDefault();discover()}
});
discover();
</script>
</body>
</html>
